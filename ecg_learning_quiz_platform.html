<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECG 臨床心電圖沉浸式學習與互動測驗系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for Game Victory -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        medical: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            800: '#115e59',
                            900: '#134e4a',
                        }
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-short': 'bounce 0.5s ease-in-out 2',
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        /* Grid overlay background for ECG feel */
        .ecg-grid-bg {
            background-size: 20px 20px;
            background-image: 
                linear-gradient(to right, rgba(239, 68, 68, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(239, 68, 68, 0.1) 1px, transparent 1px);
        }
    </style>
</head>
<body class="h-full flex flex-col text-slate-100 bg-slate-900 font-sans antialiased selection:bg-teal-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700/80 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-teal-500/10 border border-teal-500/30 flex items-center justify-center text-teal-400 shadow-inner">
                    <i class="fa-solid fa-heart-pulse text-xl animate-pulse"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide text-white flex items-center gap-2">
                        ECG 臨床心電圖學習平台
                        <span class="text-xs font-normal px-2 py-0.5 rounded bg-teal-500/20 text-teal-300 border border-teal-500/30">Ver.1151A</span>
                    </h1>
                    <p class="text-xs text-slate-400">心電圖判讀 • 臨床情境 • 考題實戰</p>
                </div>
            </div>

            <!-- Stats Header Quick View -->
            <div class="hidden md:flex items-center space-x-6 text-sm bg-slate-950/50 px-4 py-1.5 rounded-xl border border-slate-800">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-fire text-amber-500"></i>
                    <span class="text-slate-400">最高連勝:</span>
                    <span id="stat-max-streak" class="font-bold text-amber-400">0</span>
                </div>
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-book-bookmark text-rose-400"></i>
                    <span class="text-slate-400">錯題庫:</span>
                    <span id="stat-mistakes-count" class="font-bold text-rose-400">0</span>
                </div>
            </div>

            <!-- Navigation Tabs -->
            <nav class="flex space-x-1 bg-slate-950/60 p-1 rounded-xl border border-slate-800">
                <button id="btn-study-mode" onclick="switchTab('study')" class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-2 bg-teal-600 text-white shadow-sm">
                    <i class="fa-solid fa-book-open text-xs"></i>
                    <span>圖庫解析</span>
                </button>
                <button id="btn-quiz-mode" onclick="switchTab('quiz')" class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-2 text-slate-400 hover:text-white">
                    <i class="fa-solid fa-gamepad text-xs"></i>
                    <span>情境測驗</span>
                </button>
                <button id="btn-mistakes-mode" onclick="switchTab('mistakes')" class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-2 text-slate-400 hover:text-white relative">
                    <i class="fa-solid fa-circle-exclamation text-xs text-rose-400"></i>
                    <span>錯題專區</span>
                    <span id="badge-mistake-count" class="hidden absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 overflow-y-auto custom-scrollbar">

        <!-- ================= 1. 圖庫學習與重點解析 SECTION ================= -->
        <section id="study-section" class="space-y-6">
            <!-- Search, Category & Filter Bar -->
            <div class="bg-slate-800/60 backdrop-blur p-4 rounded-2xl border border-slate-700/60 flex flex-col md:flex-row justify-between items-center gap-4 shadow-lg">
                <!-- Search Box -->
                <div class="relative w-full md:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" oninput="filterStudyCards()" placeholder="搜尋疾病名稱、關鍵字..." 
                           class="w-full pl-10 pr-4 py-2 bg-slate-900/80 border border-slate-700 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm text-slate-200 placeholder-slate-500">
                </div>

                <!-- Category Filter Pills -->
                <div class="flex flex-wrap items-center gap-2 w-full md:w-auto" id="category-pills">
                    <!-- Dynamic Pills -->
                </div>

                <div class="text-xs text-slate-400 font-medium whitespace-nowrap">
                    共收錄 <span id="total-count" class="text-teal-400 font-bold text-sm">0</span> 張心電圖與重點解析
                </div>
            </div>

            <!-- ECG Cards Grid -->
            <div id="study-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cards populated dynamically by JS -->
            </div>
        </section>


        <!-- ================= 2. 情境測驗與遊戲化 SECTION ================= -->
        <section id="quiz-section" class="hidden max-w-4xl mx-auto space-y-6">
            
            <!-- Quiz Card Panel -->
            <div class="bg-slate-800/80 rounded-2xl border border-slate-700/80 shadow-2xl overflow-hidden flex flex-col">
                
                <!-- Quiz Header Bar (Timer & Score) -->
                <div class="bg-slate-950/80 border-b border-slate-700/80 p-4 flex flex-wrap justify-between items-center gap-3">
                    <div class="flex items-center space-x-3">
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">
                            進度: <span id="quiz-current-num" class="text-teal-400 text-sm font-bold">1/34</span>
                        </span>
                        <!-- Streak Badge -->
                        <div id="streak-container" class="hidden items-center space-x-1 px-2.5 py-0.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-bold animate-bounce-short">
                            <i class="fa-solid fa-fire text-amber-500"></i>
                            <span id="quiz-streak-count">0</span> 連勝中!
                        </div>
                    </div>

                    <!-- Countdown Timer -->
                    <div class="flex items-center space-x-2 bg-slate-900 px-3 py-1 rounded-lg border border-slate-700">
                        <i class="fa-regular fa-clock text-teal-400 animate-spin-slow"></i>
                        <span class="text-xs text-slate-400">剩餘時間:</span>
                        <span id="quiz-timer" class="font-mono font-bold text-teal-300">20s</span>
                    </div>

                    <div class="flex items-center space-x-4">
                        <span class="text-sm text-slate-300">總得分: <span id="quiz-score" class="font-bold text-emerald-400 text-base">0</span></span>
                        <button onclick="resetQuiz()" class="text-xs text-slate-400 hover:text-white underline transition">重新測驗</button>
                    </div>
                </div>

                <!-- Quiz Main Body -->
                <div class="p-6 space-y-6">
                    
                    <!-- ECG Image Container with Grid Feel -->
                    <div class="relative bg-slate-950 rounded-xl overflow-hidden border border-slate-800 shadow-inner flex items-center justify-center min-h-[220px] max-h-[340px] group ecg-grid-bg">
                        <img id="quiz-image" src="" alt="ECG Quiz" class="max-h-[320px] w-auto object-contain cursor-pointer transition duration-300 group-hover:scale-105" onclick="openModal(this.src)">
                        <div class="absolute bottom-2 right-2 bg-slate-900/80 backdrop-blur px-2.5 py-1 rounded-md text-[11px] text-slate-400 border border-slate-700 pointer-events-none">
                            <i class="fa-solid fa-magnifying-glass-plus mr-1"></i>點擊放大
                        </div>
                    </div>

                    <!-- Clinical Vignette Case Scenario -->
                    <div class="bg-slate-900/90 p-4 rounded-xl border border-teal-500/20 space-y-1">
                        <div class="flex items-center space-x-2 text-teal-400 text-xs font-semibold uppercase tracking-wider">
                            <i class="fa-solid fa-user-doctor"></i>
                            <span>臨床病例主訴 (Clinical Vignette)</span>
                        </div>
                        <p id="quiz-scenario" class="text-sm md:text-base text-slate-200 font-medium leading-relaxed">
                            載入中...
                        </p>
                    </div>

                    <h3 class="text-sm font-bold text-slate-300 tracking-wide uppercase">請依心電圖與病例，選擇最適當的診斷：</h3>

                    <!-- Options Grid -->
                    <div id="quiz-options" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <!-- Dynamic options buttons -->
                    </div>

                    <!-- Result & Explanation Feedback Banner -->
                    <div id="quiz-feedback" class="hidden p-5 rounded-xl space-y-3 transition border">
                        <div id="quiz-feedback-title" class="font-bold text-base flex items-center gap-2"></div>
                        <div id="quiz-feedback-explain" class="text-sm leading-relaxed text-slate-300 bg-slate-950/40 p-3 rounded-lg border border-slate-700/50"></div>
                    </div>
                </div>

                <!-- Quiz Footer Controls -->
                <div class="bg-slate-950/80 border-t border-slate-700/80 p-4 flex justify-between items-center">
                    <span id="quiz-progress-text" class="text-xs text-slate-400">請選取一個答案開始作答</span>
                    <button id="btn-next-question" onclick="nextQuestion()" disabled
                            class="px-6 py-2.5 bg-teal-600 text-white rounded-xl opacity-50 cursor-not-allowed hover:bg-teal-500 transition font-medium shadow-md flex items-center space-x-2">
                        <span>下一題</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </div>
            </div>
        </section>


        <!-- ================= 3. 錯題專區 SECTION ================= -->
        <section id="mistakes-section" class="hidden space-y-6">
            <div class="bg-slate-800/60 p-6 rounded-2xl border border-slate-700/60 shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation text-rose-400"></i>
                        個人錯題複習庫
                    </h2>
                    <p class="text-xs text-slate-400 mt-1">系統自動為您收集作答錯誤的題目，方便針對弱點加強與觀念複習。</p>
                </div>
                <div class="flex space-x-3">
                    <button id="btn-quiz-mistakes" onclick="startMistakesQuiz()" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white text-sm font-medium rounded-xl transition shadow flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-circle-play"></i>
                        <span>錯題重新測驗</span>
                    </button>
                    <button onclick="clearMistakes()" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm font-medium rounded-xl transition">
                        清空錯題
                    </button>
                </div>
            </div>

            <!-- Mistakes Grid Container -->
            <div id="mistakes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamically added mistakes cards -->
            </div>
        </section>

    </main>

    <!-- Modal for Enlarged ECG View & Full Details -->
    <div id="image-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 transition-all" onclick="closeModal()">
        <div class="relative max-w-5xl w-full bg-slate-900 border border-slate-700 p-3 md:p-4 rounded-2xl overflow-hidden shadow-2xl space-y-3" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center px-2">
                <h3 id="modal-title" class="text-base font-bold text-teal-300">心電圖細節檢視</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white bg-slate-800 w-8 h-8 rounded-full flex items-center justify-center text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="bg-slate-950 rounded-xl overflow-auto max-h-[70vh] border border-slate-800 flex items-center justify-center p-2 custom-scrollbar ecg-grid-bg">
                <img id="modal-img" src="" alt="Enlarged ECG" class="max-w-full h-auto object-contain">
            </div>

            <div id="modal-features-box" class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/80 text-xs md:text-sm text-slate-300 hidden">
                <span class="font-bold text-teal-400 block mb-1">判讀焦點：</span>
                <p id="modal-features-text" class="leading-relaxed"></p>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->

        // 圖檔相對路徑 Base Path
        const IMAGE_BASE_PATH = "./pic/";

        // 系統全局狀態 State
        let currentTab = 'study';
        let selectedCategory = 'ALL';
        let currentQuizIndex = 0;
        let score = 0;
        let streak = 0;
        let maxStreak = 0;
        let quizPool = [];
        let timerInterval = null;
        let timeLeft = 20;
        let userMistakes = []; // 儲存錯題 ID List

        // 頁面初始化
        document.addEventListener("DOMContentLoaded", () => {
            loadMistakesFromStorage();
            document.getElementById("total-count").innerText = ecgData.length;
            buildCategoryPills();
            renderStudyCards(ecgData);
            updateGlobalStats();
            initQuiz();
        });

        // 讀取 localStorage 錯題本
        function loadMistakesFromStorage() {
            const stored = localStorage.getItem("ecg_user_mistakes");
            if (stored) {
                try {
                    userMistakes = JSON.parse(stored);
                } catch (e) {
                    userMistakes = [];
                }
            }
        }

        // 儲存錯題本
        function saveMistakesToStorage() {
            localStorage.setItem("ecg_user_mistakes", JSON.stringify(userMistakes));
            updateGlobalStats();
        }

        // 更新 Header 全局統計
        function updateGlobalStats() {
            document.getElementById("stat-max-streak").innerText = maxStreak;
            document.getElementById("stat-mistakes-count").innerText = userMistakes.length;
            
            const badge = document.getElementById("badge-mistake-count");
            if (userMistakes.length > 0) {
                badge.innerText = userMistakes.length;
                badge.classList.remove("hidden");
            } else {
                badge.classList.add("hidden");
            }
        }

        // 頁面 Tab 切換
        function switchTab(mode) {
            currentTab = mode;
            const studySec = document.getElementById("study-section");
            const quizSec = document.getElementById("quiz-section");
            const mistakesSec = document.getElementById("mistakes-section");

            const btnStudy = document.getElementById("btn-study-mode");
            const btnQuiz = document.getElementById("btn-quiz-mode");
            const btnMistakes = document.getElementById("btn-mistakes-mode");

            // Hide All
            studySec.classList.add("hidden");
            quizSec.classList.add("hidden");
            mistakesSec.classList.add("hidden");

            // Reset Button Styles
            [btnStudy, btnQuiz, btnMistakes].forEach(btn => {
                btn.className = "px-3.5 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-2 text-slate-400 hover:text-white";
            });

            if (mode === 'study') {
                studySec.classList.remove("hidden");
                btnStudy.className = "px-3.5 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-2 bg-teal-600 text-white shadow-sm";
            } else if (mode === 'quiz') {
                quizSec.classList.remove("hidden");
                btnQuiz.className = "px-3.5 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-2 bg-teal-600 text-white shadow-sm";
            } else if (mode === 'mistakes') {
                mistakesSec.classList.remove("hidden");
                btnMistakes.className = "px-3.5 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-2 bg-rose-600 text-white shadow-sm";
                renderMistakesCards();
            }
        }

        // 動態建立分類篩選膠囊 (Category Pills)
        function buildCategoryPills() {
            const categories = ['ALL', ...new Set(ecgData.map(d => d.category))];
            const container = document.getElementById("category-pills");
            container.innerHTML = "";

            categories.forEach(cat => {
                const btn = document.createElement("button");
                btn.className = `px-3 py-1 rounded-full text-xs font-medium transition border ${
                    cat === 'ALL' 
                    ? 'bg-teal-500/20 text-teal-300 border-teal-500/40' 
                    : 'bg-slate-900 text-slate-400 border-slate-700 hover:border-slate-500'
                }`;
                btn.innerText = cat === 'ALL' ? '全部類別' : cat;
                btn.onclick = () => filterByCategory(cat, btn);
                container.appendChild(btn);
            });
        }

        function filterByCategory(cat, btnElement) {
            selectedCategory = cat;
            const buttons = document.querySelectorAll("#category-pills button");
            buttons.forEach(b => {
                b.className = "px-3 py-1 rounded-full text-xs font-medium transition border bg-slate-900 text-slate-400 border-slate-700 hover:border-slate-500";
            });
            btnElement.className = "px-3 py-1 rounded-full text-xs font-medium transition border bg-teal-500/20 text-teal-300 border-teal-500/40";
            filterStudyCards();
        }

        // 渲染學習模式卡片 (包含判讀焦點)
        function renderStudyCards(data) {
            const grid = document.getElementById("study-grid");
            grid.innerHTML = "";

            if (data.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">查無符合條件的心電圖資料</div>`;
                return;
            }

            data.forEach(item => {
                const card = document.createElement("div");
                card.className = "bg-slate-800/80 rounded-2xl overflow-hidden border border-slate-700/80 flex flex-col hover:border-teal-500/50 transition duration-300 shadow-md group";
                card.innerHTML = `
                    <div class="relative bg-slate-950 p-2 flex items-center justify-center h-48 cursor-pointer overflow-hidden ecg-grid-bg" onclick="openModal('${IMAGE_BASE_PATH}${item.image}', '${item.tw}', '${item.features}')">
                        <img src="${IMAGE_BASE_PATH}${item.image}" alt="${item.tw}" class="max-h-full object-contain group-hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co/400x200/1e293b/94a3b8?text=ECG+Image+NotFound'">
                        <span class="absolute top-2 left-2 px-2 py-0.5 rounded text-[10px] font-bold bg-teal-500/20 text-teal-300 border border-teal-500/30">
                            ${item.category}
                        </span>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <h2 class="text-base font-bold text-white flex items-center justify-between">
                                <span>${item.tw}</span>
                            </h2>
                            <p class="text-xs text-slate-400 font-mono mt-0.5">${item.en}</p>
                        </div>
                        
                        <!-- 核心判讀重點提示 -->
                        <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-700/60 text-xs text-slate-300 space-y-1">
                            <span class="text-teal-400 font-semibold flex items-center gap-1">
                                <i class="fa-solid fa-bolt text-[10px]"></i> 判讀特徵:
                            </span>
                            <p class="line-clamp-2 leading-relaxed text-slate-300">${item.features}</p>
                        </div>

                        <div class="pt-2 border-t border-slate-700/60 flex justify-between items-center text-xs text-slate-400">
                            <span class="truncate max-w-[180px] text-[11px]">檔名: ${item.image}</span>
                            <button onclick="openModal('${IMAGE_BASE_PATH}${item.image}', '${item.tw}', '${item.features}')" class="text-teal-400 hover:text-teal-300 font-medium flex items-center gap-1">
                                <i class="fa-solid fa-expand"></i>詳細特徵
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 搜尋與篩選邏輯
        function filterStudyCards() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const filtered = ecgData.filter(item => {
                const matchQuery = item.tw.toLowerCase().includes(query) || 
                                   item.en.toLowerCase().includes(query) || 
                                   item.features.toLowerCase().includes(query);
                const matchCat = selectedCategory === 'ALL' || item.category === selectedCategory;
                return matchQuery && matchCat;
            });
            renderStudyCards(filtered);
        }


        // ================= 測驗與遊戲化邏輯 =================

        function initQuiz(customPool = null) {
            clearInterval(timerInterval);
            quizPool = customPool ? [...customPool] : [...ecgData].sort(() => Math.random() - 0.5);
            currentQuizIndex = 0;
            score = 0;
            streak = 0;
            document.getElementById("quiz-score").innerText = score;
            document.getElementById("quiz-streak-count").innerText = streak;
            document.getElementById("streak-container").classList.add("hidden");
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timerInterval);
            if (quizPool.length === 0) return;

            const item = quizPool[currentQuizIndex];
            document.getElementById("quiz-current-num").innerText = `${currentQuizIndex + 1} / ${quizPool.length}`;
            document.getElementById("quiz-image").src = IMAGE_BASE_PATH + item.image;
            document.getElementById("quiz-scenario").innerText = item.vignette;

            // 產生干擾選項 (1正確 + 3隨機錯誤)
            const distractors = ecgData
                .filter(d => d.tw !== item.tw)
                .sort(() => Math.random() - 0.5)
                .slice(0, 3);
            
            const options = [...distractors, item].sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById("quiz-options");
            optionsContainer.innerHTML = "";

            options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "w-full p-3.5 text-left rounded-xl bg-slate-900/80 border border-slate-700/80 hover:border-teal-500 hover:bg-teal-500/10 transition font-medium text-slate-200 text-sm option-btn flex items-center justify-between group";
                btn.innerHTML = `
                    <span>${opt.tw} <span class="text-xs text-slate-400 block md:inline font-mono">(${opt.en})</span></span>
                    <i class="fa-regular fa-circle text-slate-600 group-hover:text-teal-400"></i>
                `;
                btn.onclick = () => checkAnswer(btn, opt.tw === item.tw, item);
                optionsContainer.appendChild(btn);
            });

            // 重置 UI 狀態
            const feedback = document.getElementById("quiz-feedback");
            feedback.className = "hidden p-5 rounded-xl space-y-3 transition border";
            
            const nextBtn = document.getElementById("btn-next-question");
            nextBtn.disabled = true;
            nextBtn.classList.add("opacity-50", "cursor-not-allowed");

            // 啟動倒數計時器 (20秒)
            startTimer(item);
        }

        // 計時器邏輯
        function startTimer(currentItem) {
            timeLeft = 60;
            const timerDisplay = document.getElementById("quiz-timer");
            timerDisplay.innerText = `${timeLeft}s`;
            timerDisplay.className = "font-mono font-bold text-teal-300";

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `${timeLeft}s`;

                if (timeLeft <= 5) {
                    timerDisplay.className = "font-mono font-bold text-rose-400 animate-pulse";
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    // 超時自動視為答錯
                    handleTimeout(currentItem);
                }
            }, 1000);
        }

        // 超時處理
        function handleTimeout(item) {
            disableAllOptionButtons();
            recordMistake(item.id);

            streak = 0;
            document.getElementById("streak-container").classList.add("hidden");

            const feedback = document.getElementById("quiz-feedback");
            feedback.classList.remove("hidden");
            feedback.className = "p-5 rounded-xl space-y-2 border bg-amber-500/10 border-amber-500/30 text-amber-300";

            document.getElementById("quiz-feedback-title").innerHTML = `<i class="fa-solid fa-hourglass-end text-amber-400"></i> 作答超時！`;
            document.getElementById("quiz-feedback-explain").innerHTML = `正確答案為：<strong>${item.tw} (${item.en})</strong><br><br><strong>判讀要點：</strong>${item.features}`;

            enableNextButton();
        }

        // 檢查答案
        function checkAnswer(selectedBtn, isCorrect, item) {
            clearInterval(timerInterval);
            disableAllOptionButtons();

            const feedback = document.getElementById("quiz-feedback");
            feedback.classList.remove("hidden");

            const feedbackTitle = document.getElementById("quiz-feedback-title");
            const feedbackExplain = document.getElementById("quiz-feedback-explain");

            if (isCorrect) {
                selectedBtn.className = "w-full p-3.5 text-left rounded-xl bg-emerald-500/20 border-2 border-emerald-500 text-emerald-200 font-medium text-sm flex items-center justify-between";
                selectedBtn.querySelector("i").className = "fa-solid fa-circle-check text-emerald-400";

                feedback.className = "p-5 rounded-xl space-y-2 border bg-emerald-500/10 border-emerald-500/30 text-emerald-300";
                feedbackTitle.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> 回答正確！ (+10 分)`;

                score += 10;
                streak++;
                if (streak > maxStreak) {
                    maxStreak = streak;
                }

                // 觸發連勝效果
                if (streak >= 2) {
                    const streakContainer = document.getElementById("streak-container");
                    document.getElementById("quiz-streak-count").innerText = streak;
                    streakContainer.classList.remove("hidden");
                    streakContainer.classList.add("flex");
                }

                document.getElementById("quiz-score").innerText = score;

            } else {
                selectedBtn.className = "w-full p-3.5 text-left rounded-xl bg-rose-500/20 border-2 border-rose-500 text-rose-200 font-medium text-sm flex items-center justify-between";
                selectedBtn.querySelector("i").className = "fa-solid fa-circle-xmark text-rose-400";

                feedback.className = "p-5 rounded-xl space-y-2 border bg-rose-500/10 border-rose-500/30 text-rose-300";
                feedbackTitle.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-400"></i> 回答錯誤！`;

                // 答錯加入錯題庫
                recordMistake(item.id);

                // 重置 Streak
                streak = 0;
                document.getElementById("streak-container").classList.add("hidden");
            }

            feedbackExplain.innerHTML = `<strong>正確答案：</strong> ${item.tw} (${item.en})<br><br><strong>核心特徵解析：</strong> ${item.features}`;

            updateGlobalStats();
            enableNextButton();
        }

        function disableAllOptionButtons() {
            const allBtns = document.querySelectorAll(".option-btn");
            allBtns.forEach(btn => {
                btn.disabled = true;
                btn.classList.add("cursor-default", "opacity-80");
            });
        }

        function enableNextButton() {
            const nextBtn = document.getElementById("btn-next-question");
            nextBtn.disabled = false;
            nextBtn.classList.remove("opacity-50", "cursor-not-allowed");
        }

        // 記錄錯題
        function recordMistake(id) {
            if (!userMistakes.includes(id)) {
                userMistakes.push(id);
                saveMistakesToStorage();
            }
        }

        // 下一題
        function nextQuestion() {
            if (currentQuizIndex < quizPool.length - 1) {
                currentQuizIndex++;
                loadQuestion();
            } else {
                // 測驗結束慶祝
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                }
                alert(`🎉 測驗完成！\n您的總得分為：${score} 分\n最高連續答對：${streak} 題`);
                initQuiz();
            }
        }

        function resetQuiz() {
            initQuiz();
        }


        // ================= 3. 錯題專區邏輯 =================

        function renderMistakesCards() {
            const grid = document.getElementById("mistakes-grid");
            const btnQuizMistakes = document.getElementById("btn-quiz-mistakes");
            grid.innerHTML = "";

            const mistakeItems = ecgData.filter(d => userMistakes.includes(d.id));

            if (mistakeItems.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-500 bg-slate-800/40 rounded-2xl border border-slate-700/50">
                    <i class="fa-solid fa-circle-check text-4xl text-teal-400 mb-3 block"></i>
                    尚未有錯題紀錄，繼續保持！
                </div>`;
                btnQuizMistakes.disabled = true;
                return;
            }

            btnQuizMistakes.disabled = false;

            mistakeItems.forEach(item => {
                const card = document.createElement("div");
                card.className = "bg-slate-800/80 rounded-2xl overflow-hidden border border-rose-500/30 flex flex-col shadow-md";
                card.innerHTML = `
                    <div class="relative bg-slate-950 p-2 flex items-center justify-center h-44 ecg-grid-bg">
                        <img src="${IMAGE_BASE_PATH}${item.image}" alt="${item.tw}" class="max-h-full object-contain">
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-rose-500/20 text-rose-300 border border-rose-500/30">需要複習</span>
                            <h3 class="text-base font-bold text-white mt-1">${item.tw}</h3>
                            <p class="text-xs text-slate-400 font-mono">${item.en}</p>
                        </div>
                        <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-700/60 text-xs text-slate-300">
                            <span class="text-teal-400 font-semibold">特徵重點：</span>
                            <p class="mt-0.5 leading-relaxed text-slate-300">${item.features}</p>
                        </div>
                        <div class="pt-2 border-t border-slate-700/60 flex justify-end">
                            <button onclick="removeMistake(${item.id})" class="text-xs text-slate-400 hover:text-rose-400 transition flex items-center gap-1">
                                <i class="fa-solid fa-trash"></i> 移出錯題庫
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function removeMistake(id) {
            userMistakes = userMistakes.filter(mId => mId !== id);
            saveMistakesToStorage();
            renderMistakesCards();
        }

        function clearMistakes() {
            if (confirm("確定要清空所有的錯題紀錄嗎？")) {
                userMistakes = [];
                saveMistakesToStorage();
                renderMistakesCards();
            }
        }

        function startMistakesQuiz() {
            const mistakeItems = ecgData.filter(d => userMistakes.includes(d.id));
            if (mistakeItems.length > 0) {
                switchTab('quiz');
                initQuiz(mistakeItems);
            }
        }


        // Modal Operations
        function openModal(src, title = "心電圖細節檢視", features = "") {
            document.getElementById("modal-img").src = src;
            document.getElementById("modal-title").innerText = title;
            
            const featureBox = document.getElementById("modal-features-box");
            if (features) {
                document.getElementById("modal-features-text").innerText = features;
                featureBox.classList.remove("hidden");
            } else {
                featureBox.classList.add("hidden");
            }

            document.getElementById("image-modal").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("image-modal").classList.add("hidden");
        }
    </script>
</body>
</html>
